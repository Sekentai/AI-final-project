name: Build AI Use Declaration DOCX
on:
  push:
    paths:
      - 'docs/AI_Use_Declaration.md'
      - 'scripts/build_declaration.py'
      - '.github/workflows/ai-declaration-docx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DOCX dependency
        run: python -m pip install python-docx==1.2.0
      - name: Build editable declaration
        run: python scripts/build_declaration.py
      - name: Commit DOCX to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AI_Use_Declaration.docx
          if ! git diff --cached --quiet; then
            git commit -m "Add editable ParkPilot AI use declaration"
            git pull --rebase origin main
            git push origin main
          fi
